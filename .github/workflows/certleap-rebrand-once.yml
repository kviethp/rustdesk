name: CertLeap rebrand audit

on:
  push:
    paths:
      - '.github/workflows/certleap-rebrand-once.yml'

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: certleap-academy
          fetch-depth: 0

      - name: Apply targeted branding replacements and audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('flutter/lib/mobile/pages/settings_page.dart'): [
                  ("Keep RustDesk background service", "Keep CertLeap Academy background service"),
                  ("About RustDesk", "About CertLeap Academy"),
                  ("const url = 'https://rustdesk.com/';", "const url = '';"),
                  ("onPressed: (context) =>\n                  launchUrlString('https://rustdesk.com/privacy.html'),", "onPressed: null,"),
                  ("onPressed: (context) async {\n                  await launchUrl(Uri.parse(url));\n                },", "onPressed: null,"),
                  ("onTap: () async {\n              const url = 'https://rustdesk.com/';\n              await launchUrl(Uri.parse(url));\n            },", "onTap: null,"),
                  ("Text('rustdesk.com',", "Text('',"),
              ],
              Path('flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/MainActivity.kt'): [
                  ('.rustdesk-', '.certleap-'),
              ],
              Path('.github/workflows/flutter-build.yml'): [
                  ('name: Build the flutter version of the RustDesk', 'name: Build the flutter version of CertLeap Academy'),
                  ('Patch RustDesk sources for Flutter 3.44', 'Patch CertLeap Academy sources for Flutter 3.44'),
                  ('# Windows: build RustDesk', '# Windows: build CertLeap Academy'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  if old in text:
                      text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')

          skip_dirs = {'.git', 'target', 'build', '.dart_tool', 'node_modules', 'vcpkg', 'third_party'}
          binary_ext = {'.png','.jpg','.jpeg','.gif','.ico','.icns','.so','.dll','.exe','.a','.lib','.zip','.gz','.xz','.7z','.pdf','.ttf','.woff','.woff2','.jar','.apk','.aab'}
          rows = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or any(part in skip_dirs for part in p.parts) or p.suffix.lower() in binary_ext:
                  continue
              try:
                  lines = p.read_text(encoding='utf-8', errors='strict').splitlines()
              except Exception:
                  continue
              for n, line in enumerate(lines, 1):
                  if 'rustdesk' in line.lower():
                      rows.append(f'{p}:{n}: {line.strip()}')
          Path('certleap-rebrand-audit.txt').write_text('\n'.join(rows) + ('\n' if rows else ''), encoding='utf-8')
          print(f'Remaining rustdesk references: {len(rows)}')
          PY

      - name: Commit rebrand and audit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter/lib/mobile/pages/settings_page.dart \
                  flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/MainActivity.kt \
                  .github/workflows/flutter-build.yml
          git add -f certleap-rebrand-audit.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: finish CertLeap user-facing rebrand audit"
            git push origin HEAD:certleap-academy
          fi
