name: CertLeap URI identity fix

on:
  push:
    branches:
      - certleap-rebrand-phase2
    paths:
      - .github/workflows/certleap-uri-audit.yml

permissions:
  contents: write

jobs:
  fix-uri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/certleap-rebrand-phase2
          fetch-depth: 0

      - name: Patch CertLeap URI identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(f'{path}: expected {expected} occurrence(s) of {old!r}, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')
              print(f'updated {path}: {count}')

          replace_exact(
              'src/common.rs',
              '''pub fn get_uri_prefix() -> String {\n    format!("{}://", get_app_name().to_lowercase())\n}''',
              '''pub fn get_uri_prefix() -> String {\n    let app_name = get_app_name();\n    if app_name == "CertLeap Academy" {\n        "certleap://".to_owned()\n    } else {\n        format!("{}://", app_name.to_lowercase())\n    }\n}''',
          )
          replace_exact(
              'flutter/lib/mobile/pages/home_page.dart',
              'fakelink = "rustdesk://${list.join(s)}";',
              'fakelink = "${bind.mainUriPrefixSync()}${list.join(s)}";',
          )
          replace_exact(
              'flutter/lib/desktop/pages/desktop_home_page.dart',
              "bind.mainUriPrefixSync().contains('rustdesk')) {",
              "bind.mainUriPrefixSync().contains('certleap')) {",
          )
          replace_exact(
              'flutter/lib/common.dart',
              'rustdesk://',
              'certleap://',
              expected=5,
          )
          replace_exact(
              'libs/base/protos/message.proto',
              'or "rustdesk://*" (jump in app).',
              'or "certleap://*" (jump in app).',
          )
          replace_exact(
              'src/server/connection.rs',
              'format!("RustDesk://FsJob//Printer/{}", get_time())',
              'format!("CertLeap://FsJob//Printer/{}", get_time())',
          )
          PY

      - name: Verify URI identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          common = Path('src/common.rs').read_text(encoding='utf-8')
          assert '"certleap://".to_owned()' in common
          manifest = Path('flutter/android/app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          assert '<data android:scheme="certleap" />' in manifest
          home = Path('flutter/lib/mobile/pages/home_page.dart').read_text(encoding='utf-8')
          assert 'fakelink = "${bind.mainUriPrefixSync()}${list.join(s)}";' in home
          desktop = Path('flutter/lib/desktop/pages/desktop_home_page.dart').read_text(encoding='utf-8')
          assert "bind.mainUriPrefixSync().contains('certleap'))" in desktop
          for path in [
              'flutter/lib/mobile/pages/home_page.dart',
              'flutter/lib/common.dart',
              'flutter/lib/desktop/pages/desktop_home_page.dart',
              'libs/base/protos/message.proto',
          ]:
              text = Path(path).read_text(encoding='utf-8')
              if 'rustdesk://' in text.lower():
                  raise AssertionError(f'{path}: still contains rustdesk://')
          print('CertLeap URI scheme is aligned across core, Android and Flutter deep links.')
          PY
          cargo fmt --all -- --check
          git diff --check

      - name: Audit remaining RustDesk URI-like identifiers
        shell: bash
        run: |
          grep -RniE 'rustdesk://|rustdesk:' src flutter libs res 2>/dev/null | head -n 300 || true

      - name: Commit URI fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/common.rs \
                  src/server/connection.rs \
                  flutter/lib/mobile/pages/home_page.dart \
                  flutter/lib/desktop/pages/desktop_home_page.dart \
                  flutter/lib/common.dart \
                  libs/base/protos/message.proto
          git diff --cached --check
          git commit -m "fix: align CertLeap URI scheme"
          git push origin HEAD:refs/heads/certleap-rebrand-phase2
