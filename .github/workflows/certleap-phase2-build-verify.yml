name: CertLeap phase 2 build verification

on:
  push:
    branches:
      - certleap-rebrand-phase2
    paths:
      - .github/workflows/certleap-phase2-build-verify.yml

permissions:
  contents: write

jobs:
  run-ci:
    permissions:
      contents: write
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: false
