name: CertLeap phase 2 retry

on:
  push:
    branches:
      - certleap-rebrand-phase2
    paths:
      - .github/workflows/certleap-phase2-retry.yml

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: refs/heads/certleap-rebrand-phase2
          fetch-depth: 0

      - name: Recover tested patch scripts as runtime files
        shell: bash
        run: |
          git show ae438900012fddfa1bdba789b9f1722f10845e26:.github/workflows/certleap-phase2-once.yml > /tmp/phase2-source.yml
          python3 - <<'PY'
          from pathlib import Path

          source = Path('/tmp/phase2-source.yml').read_text(encoding='utf-8')

          def extract_step(name, next_name):
              start_marker = f'      - name: {name}\n'
              next_marker = f'      - name: {next_name}\n'
              start = source.index(start_marker)
              run_start = source.index('        run: |\n', start) + len('        run: |\n')
              end = source.index(next_marker, run_start)
              raw = source[run_start:end]
              lines = []
              for line in raw.splitlines():
                  if line.startswith('          '):
                      lines.append(line[10:])
                  elif not line.strip():
                      lines.append('')
                  else:
                      raise RuntimeError(f'Unexpected indentation in {name}: {line!r}')
              return '\n'.join(lines) + '\n'

          apply_script = extract_step(
              'Apply targeted CertLeap phase 2 changes',
              'GREEN - verify phase 2 branding and syntax',
          )
          duplicate_url = '''replace_once(msi, '\"v\": \"https://github.com/rustdesk/rustdesk\",', '\"v\": \"\",')'''
          replacement = '''replace_all(msi, '\"v\": \"https://github.com/rustdesk/rustdesk\",', '\"v\": \"\",', minimum=2)'''
          count = apply_script.count(duplicate_url)
          if count != 2:
              raise RuntimeError(f'Expected two duplicate RustDesk ARP URL replacements, found {count}')
          apply_script = apply_script.replace(duplicate_url, replacement)

          Path('/tmp/apply-phase2.sh').write_text(apply_script, encoding='utf-8')
          Path('/tmp/verify-phase2.sh').write_text(
              extract_step(
                  'GREEN - verify phase 2 branding and syntax',
                  'Audit remaining upstream branding in app-facing areas',
              ),
              encoding='utf-8',
          )
          PY

      - name: Apply base CertLeap phase 2 changes
        shell: bash
        run: bash /tmp/apply-phase2.sh

      - name: Rebrand remaining app-facing references found by audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_exact(path, old, new, expected=1):
              text = read(path)
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(f'{path}: expected {expected} occurrences of {old!r}, found {count}')
              write(path, text.replace(old, new))
              print(f'updated {path}: {count} replacement(s)')

          # Mobile update prompt: keep the update notice but do not launch the upstream RustDesk download page.
          path = 'flutter/lib/mobile/pages/connection_page.dart'
          text = read(path)
          start = text.index('  Widget _buildUpdateUI(String updateUrl) {')
          end = text.index('\n  }', start) + len('\n  }')
          old_method = text[start:end]
          new_method = '''  Widget _buildUpdateUI(String updateUrl) {
    return updateUrl.isEmpty
        ? const SizedBox(height: 0)
        : Container(
            alignment: AlignmentDirectional.center,
            width: double.infinity,
            color: Colors.pinkAccent,
            padding: const EdgeInsets.symmetric(vertical: 12),
            child: Text(translate('Download new version'),
                style: const TextStyle(
                    color: Colors.white, fontWeight: FontWeight.bold)));
  }'''
          write(path, text[:start] + new_method + text[end:])
          print(f'updated {path}')

          # Desktop public-server upsell pointed to RustDesk pricing; hide it until a CertLeap URL is configured.
          path = 'flutter/lib/desktop/pages/connection_page.dart'
          text = read(path)
          text = text.replace("import 'package:url_launcher/url_launcher_string.dart';\n", '')
          start = text.index('  void onUsePublicServerGuide() {')
          end = text.index('\n  }', start) + len('\n  }')
          text = text[:start] + text[end + 1:]
          start = text.index('    setupServerWidget() =>')
          end = text.index('    basicWidget() =>', start)
          text = text[:start] + '    setupServerWidget() => const SizedBox.shrink();\n\n' + text[end:]
          write(path, text)
          print(f'updated {path}')

          # Desktop update/help cards: remove upstream download, changelog and Linux documentation links.
          path = 'flutter/lib/desktop/pages/desktop_home_page.dart'
          text = read(path)
          old = '''      String btnText = isToUpdate ? 'Update' : 'Download';
      GestureTapCallback onPressed = () async {
        final Uri url = Uri.parse('https://rustdesk.com/download');
        await launchUrl(url);
      };
'''
          new = '''      String btnText = isToUpdate ? 'Update' : '';
      GestureTapCallback onPressed = () {};
'''
          if old not in text:
              raise RuntimeError(f'{path}: update download block not found')
          text = text.replace(old, new, 1)
          old = '''          help: isToUpdate ? 'Changelog' : null,
          link: isToUpdate
              ? 'https://github.com/rustdesk/rustdesk/releases/tag/${bind.mainGetNewVersion()}'
              : null);'''
          new = '''          help: null,
          link: null);'''
          if old not in text:
              raise RuntimeError(f'{path}: changelog block not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              "            help: 'Help',\n            link:\n                'https://rustdesk.com/docs/en/client/linux/#permissions-issue',",
              '            help: null,\n            link: null,',
              1,
          )
          text = text.replace(
              "            help: 'Help',\n            link: 'https://rustdesk.com/docs/en/client/linux/#x11-required'));",
              '            help: null,\n            link: null));',
              1,
          )
          text = text.replace(
              "            help: 'Help',\n            link: 'https://rustdesk.com/docs/en/client/linux/#login-screen'));",
              '            help: null,\n            link: null));',
              1,
          )
          write(path, text)
          print(f'updated {path}')

          # Desktop About page: keep license/version details, remove unconfigured upstream website/privacy actions.
          path = 'flutter/lib/desktop/pages/desktop_setting_page.dart'
          text = read(path)
          text = text.replace("      const linkStyle = TextStyle(decoration: TextDecoration.underline);\n", '', 1)
          text = text.replace("_Card(title: translate('About RustDesk')", "_Card(title: translate('About CertLeap Academy')", 1)
          privacy = '''              InkWell(
                  onTap: () {
                    launchUrlString('https://rustdesk.com/privacy.html');
                  },
                  child: Text(
                    translate('Privacy Statement'),
                    style: linkStyle,
                  ).marginSymmetric(vertical: 4.0)),
'''
          privacy_new = '''              Text(translate('Privacy Statement'))
                  .marginSymmetric(vertical: 4.0),
'''
          if privacy not in text:
              raise RuntimeError(f'{path}: privacy block not found')
          text = text.replace(privacy, privacy_new, 1)
          website = '''              InkWell(
                  onTap: () {
                    launchUrlString('https://rustdesk.com');
                  },
                  child: Text(
                    translate('Website'),
                    style: linkStyle,
                  ).marginSymmetric(vertical: 4.0)),
'''
          if website not in text:
              raise RuntimeError(f'{path}: website block not found')
          text = text.replace(website, '', 1)
          write(path, text)
          print(f'updated {path}')

          # Installer EULA label remains visible but no longer opens RustDesk privacy page.
          path = 'flutter/lib/desktop/pages/install_page.dart'
          text = read(path)
          old = '''                          InkWell(
                            hoverColor: Colors.transparent,
                            onTap: () => launchUrlString(
                                'https://rustdesk.com/privacy.html'),
                            child: Tooltip(
                              message: 'https://rustdesk.com/privacy.html',
                              child: Row(children: [
                                Icon(Icons.launch_outlined, size: 16)
                                    .marginOnly(right: 5),
                                Text(
                                  translate('End-user license agreement'),
                                  style: const TextStyle(
                                      decoration: TextDecoration.underline),
                                )
                              ]),
                            ),
                          ),
'''
          new = '''                          Text(translate('End-user license agreement')),
'''
          if old not in text:
              raise RuntimeError(f'{path}: EULA link block not found')
          text = text.replace(old, new, 1)
          write(path, text)
          print(f'updated {path}')

          # Android system-visible service identity.
          path = 'flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/MainService.kt'
          text = read(path)
          replacements = {
              'const val DEFAULT_NOTIFY_TITLE = "RustDesk"': 'const val DEFAULT_NOTIFY_TITLE = "CertLeap Academy"',
              '"rustdesk:wakelock"': '"certleap:wakelock"',
              '"RustDeskVD"': '"CertLeapVD"',
              'val channelId = "RustDesk"': 'val channelId = "certleap_service"',
              'val channelName = "RustDesk Service"': 'val channelName = "CertLeap Academy Service"',
              'description = "RustDesk Service Channel"': 'description = "CertLeap Academy Service Channel"',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise RuntimeError(f'{path}: expected one {old!r}, found {text.count(old)}')
              text = text.replace(old, new, 1)
          write(path, text)
          print(f'updated {path}')

          path = 'flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/FloatingWindowService.kt'
          text = read(path)
          if text.count('idShowRustDesk') != 2 or text.count('Show RustDesk') != 1:
              raise RuntimeError(f'{path}: unexpected floating menu branding counts')
          text = text.replace('idShowRustDesk', 'idShowCertLeap')
          text = text.replace('Show RustDesk', 'Show CertLeap Academy')
          write(path, text)
          print(f'updated {path}')

          # Static MSI support examples should not point at upstream branding either.
          path = 'res/msi/Package/Fragments/AddRemoveProperties.wxs'
          text = read(path)
          count = text.count('https://github.com/rustdesk/rustdesk')
          if count != 5:
              raise RuntimeError(f'{path}: expected 5 upstream support URL examples, found {count}')
          text = text.replace('https://github.com/rustdesk/rustdesk', '')
          write(path, text)
          print(f'updated {path}: {count} replacements')
          PY

      - name: Verify base phase 2 branding and syntax
        shell: bash
        run: bash /tmp/verify-phase2.sh

      - name: Verify audit findings are removed
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          failures = []
          checks = {
              'flutter/lib/mobile/pages/connection_page.dart': ['rustdesk.com/download'],
              'flutter/lib/desktop/pages/connection_page.dart': ['rustdesk.com/pricing', 'onUsePublicServerGuide'],
              'flutter/lib/desktop/pages/desktop_home_page.dart': [
                  'rustdesk.com/download',
                  'github.com/rustdesk/rustdesk/releases',
                  'rustdesk.com/docs/en/client/linux',
              ],
              'flutter/lib/desktop/pages/desktop_setting_page.dart': [
                  'About RustDesk', 'rustdesk.com/privacy.html', 'rustdesk.com\'',
              ],
              'flutter/lib/desktop/pages/install_page.dart': ['rustdesk.com/privacy.html'],
              'flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/MainService.kt': [
                  'DEFAULT_NOTIFY_TITLE = "RustDesk"',
                  '"rustdesk:wakelock"',
                  '"RustDeskVD"',
                  'channelId = "RustDesk"',
                  '"RustDesk Service"',
                  '"RustDesk Service Channel"',
              ],
              'flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/FloatingWindowService.kt': [
                  'Show RustDesk', 'idShowRustDesk',
              ],
              'res/msi/Package/Fragments/AddRemoveProperties.wxs': ['https://github.com/rustdesk/rustdesk'],
          }
          for path, forbidden in checks.items():
              text = Path(path).read_text(encoding='utf-8')
              for needle in forbidden:
                  if needle in text:
                      failures.append(f'{path}: still contains {needle!r}')
          if failures:
              print('App-facing rebrand verification failed:')
              print('\n'.join(f' - {item}' for item in failures))
              raise SystemExit(1)
          print('App-facing audit findings removed.')
          PY
          python3 -m py_compile build.py res/msi/preprocess.py
          git diff --check

      - name: Audit remaining upstream references
        shell: bash
        run: |
          echo '--- Remaining Flutter RustDesk URLs/explicit UI names ---'
          grep -RniE 'rustdesk\.com|About RustDesk|Keep RustDesk|Show RustDesk|github\.com/rustdesk/rustdesk/releases' flutter/lib || true
          echo '--- Remaining Android RustDesk strings ---'
          grep -RniE 'RustDesk|rustdesk:wakelock' flutter/android/app/src/main --exclude='*.so' || true
          echo '--- Remaining MSI RustDesk URLs ---'
          grep -RniE 'https?://[^ ]*rustdesk' res/msi || true

      - name: Commit source changes and stage workflow content
        shell: bash
        run: |
          cp .github/workflows/flutter-build.yml certleap-flutter-build.yml.stage
          git checkout -- .github/workflows/flutter-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter/lib/mobile/pages/settings_page.dart \
                  flutter/lib/mobile/pages/connection_page.dart \
                  flutter/lib/desktop/pages/connection_page.dart \
                  flutter/lib/desktop/pages/desktop_home_page.dart \
                  flutter/lib/desktop/pages/desktop_setting_page.dart \
                  flutter/lib/desktop/pages/install_page.dart \
                  flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/MainActivity.kt \
                  flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/MainService.kt \
                  flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/FloatingWindowService.kt \
                  flutter/windows/CMakeLists.txt \
                  build.py \
                  res/msi \
                  certleap-flutter-build.yml.stage
          git diff --cached --stat
          git diff --cached --check
          git commit -m "chore: complete CertLeap phase 2 app identity"
          git push origin HEAD:refs/heads/certleap-rebrand-phase2
