name: CertLeap Phase 3 installer identity

on:
  push:
    branches:
      - certleap-phase3-installer-server-fallback
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer-identity:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Apply Windows installer identity patch
        shell: pwsh
        run: |
          python .github/scripts/certleap_phase3_windows_identity.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply Windows package naming patch
        shell: pwsh
        run: |
          python .github/scripts/certleap_phase3_packaging.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run standalone installer identity tests
        shell: pwsh
        run: |
          @'
          #[path = "src/platform/windows/installer_identity.rs"]
          mod installer_identity;
          '@ | Set-Content installer_identity_harness.rs
          rustc --edition 2021 --test installer_identity_harness.rs -o installer_identity_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\installer_identity_tests.exe

      - name: Verify Windows installer identity wiring
        shell: pwsh
        run: |
          $source = Get-Content 'src/platform/windows.rs' -Raw
          $checks = @(
            @{ Name = 'identity module'; Pattern = 'mod installer_identity;' },
            @{ Name = 'installed executable path'; Pattern = 'installer_identity::installed_executable_path' },
            @{ Name = 'service dispatcher identity'; Pattern = 'service_dispatcher::start\(installer_identity::SERVICE_NAME' },
            @{ Name = 'service handler identity'; Pattern = 'service_control_handler::register\(installer_identity::SERVICE_NAME' },
            @{ Name = 'service creation identity'; Pattern = 'service_name = installer_identity::SERVICE_NAME' },
            @{ Name = 'URI protocol identity'; Pattern = 'installer_identity::URI_SCHEME' },
            @{ Name = 'binary process identity'; Pattern = 'installer_identity::APP_EXE_STEM' }
          )
          foreach ($check in $checks) {
            if ($source -notmatch $check.Pattern) {
              Write-Error "Missing CertLeap Windows identity wiring: $($check.Name)"
              exit 1
            }
          }
          if ($source.Contains('taskkill /F /IM {app_name}.exe')) {
            Write-Error 'Windows service install still derives the process image from the display name.'
            exit 1
          }

      - name: Verify Windows package naming
        shell: pwsh
        run: |
          $buildPy = Get-Content 'build.py' -Raw
          $releaseWorkflow = Get-Content '.github/workflows/flutter-build.yml' -Raw
          if ($buildPy -notmatch 'certleap-academy-\{version\}-portable\.exe') {
            Write-Error 'build.py still does not identify the self-extracting EXE as Portable.'
            exit 1
          }
          if ($releaseWorkflow -notmatch 'certleap-academy-\$\{\{ env\.VERSION \}\}-\$\{\{ matrix\.job\.arch \}\}-portable\.exe') {
            Write-Error 'flutter-build.yml still publishes the self-extracting EXE without the Portable suffix.'
            exit 1
          }
          if ($releaseWorkflow -notmatch 'certleap-academy-\$\{\{ env\.VERSION \}\}-\$\{\{ matrix\.job\.arch \}\}\.msi') {
            Write-Error 'MSI setup artifact naming is missing.'
            exit 1
          }

      - name: Commit verified source and staged release workflow
        shell: bash
        run: |
          git config user.name "kviethp"
          git config user.email "86997943+kviethp@users.noreply.github.com"
          git add src/platform/windows.rs build.py
          if [ -f .github/scripts/staged_flutter_build_phase3.yml ]; then
            git add .github/scripts/staged_flutter_build_phase3.yml
          fi
          if git diff --cached --quiet; then
            echo "Phase 3 installer/package changes already committed."
            exit 0
          fi
          git commit -m "fix: distinguish CertLeap setup and portable packages"
          git push origin HEAD:refs/heads/certleap-phase3-installer-server-fallback
